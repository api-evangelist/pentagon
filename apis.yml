aid: pentagon
name: Pentagon
description: >-
  Pentagon is a work studio that turns AI agents into teammates — a shared
  workspace where autonomous agents communicate, delegate tasks, and
  self-organize as a team under human oversight. Built by Arlington Labs, Inc.
  and backed by Y Combinator (Spring 2026), Pentagon runs as a native Mac app
  centered on a spatial canvas where every agent has a place, a live status
  report, persistent memory, and a knowledge base that compounds over time.
  Agents run on pluggable runtimes (Claude Code, Codex), attach reusable skill
  packs (slash-commands like /review, /qa, /ship), and connect to Gmail, Slack,
  GitHub, Linear, and 200+ other apps to do real work. Pentagon positions
  itself as the control plane for agent-native work — "stop running agents,
  start running teams."
